metadata:
  id: DO-001
  module: 桌面整理
  feature: 桌面整理（一键归类）
  version: 3.0.0
  status: implemented
  priority: P0
  created_at: '2026-06-15'
  updated_at: '2026-06-23'
  author: AI
  prd_source: AI动态桌面_V2_PRD.md
description:
  summary: 桌面整理模块提供「一键整理桌面」能力——经典左右分区：应用图标靠左、文件类图标靠右（仿 Fences，不绘制栅格框）。
  detail: >
    通过桌面 ListView 跨进程读取图标真实显示名进行分类，整理前清除 LVS_AUTOARRANGE 使坐标持久化。
    左侧：应用/快捷方式/系统图标（此电脑排第一，其次其他虚拟图标，再按字母序），自上而下填满一列后向右推进。
    右侧：文件夹 / 文档 / 图片 / 视频音频 / 其他（非应用图标）按类别分区（横向带，图片单独成区）——每个类别占一条横向带（固定列宽、左→右填充满则下行），各带自上而下堆叠、之间留一行空隙，整体紧贴右边缘。
    仅调整图标显示坐标，桌面文件实际位置不变。支持一键隐藏/显示全部桌面图标。
    v3.0.0 移除视觉覆盖式分区与栅格叠加层（Fence Overlay）实现。
  scope: 左右分区归类（应用靠左/文件靠右）、显示坐标调整（文件不移动）、一键隐藏/显示桌面图标
user_stories:
  - id: US-001
    role: 用户
    action: 点击「一键整理桌面」
    goal: 杂乱图标自动按类型归类并靠右排列
    priority: P0
  - id: US-002
    role: 用户
    action: 一键隐藏/显示桌面图标
    goal: 快速获得纯净桌面以欣赏壁纸
    priority: P1
  - id: US-003
    role: 用户
    action: 整理后查看桌面
    goal: 文件实际位置不变，仅显示位置变化
    priority: P0
