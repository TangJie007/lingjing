metadata:
  id: "DO-002"
  module: "桌面整理"
  feature: "文件夹门户"
  version: "2.0.0"
  status: draft
  priority: P1
  created_at: "2026-06-15"
  updated_at: "2026-06-15"
  author: "AI"
  prd_source: "AI动态桌面_V2_PRD.md"

description:
  summary: "将真实文件夹映射到桌面分区，直接在桌面操作文件夹内容，无需打开资源管理器。"
  detail: >
    新建分区时可选择文件夹门户模式，选择本地文件夹。
    分区内实时显示映射文件夹的所有文件和子文件夹，双击用系统默认程序打开。
    拖入新文件到分区实际移动到映射文件夹。文件夹内容外部变化时分区内实时刷新。
    映射文件夹被删除时分区内显示提示。
  scope: "文件夹映射、实时同步、拖入移动、外部变化刷新"

user_stories:
  - id: "US-001"
    role: "用户"
    action: "将文件夹映射到桌面分区"
    goal: "直接在桌面操作文件"
    priority: P1

acceptance_criteria:
  - id: "AC-001"
    description: "创建文件夹门户"
    expected_result: "Given 用户新建分区，When 选择文件夹门户模式并选择本地文件夹，Then 分区显示文件夹内容"
    test_method: auto
  - id: "AC-002"
    description: "实时显示文件"
    expected_result: "Given 文件夹门户已创建，When 查看分区，Then 实时显示映射文件夹的所有文件和子文件夹"
    test_method: auto
  - id: "AC-003"
    description: "双击打开文件"
    expected_result: "Given 用户在文件夹门户分区内，When 双击文件，Then 用系统默认程序打开"
    test_method: auto
  - id: "AC-004"
    description: "拖入文件移动"
    expected_result: "Given 用户拖入新文件到文件夹门户分区，When 放入，Then 实际移动到映射的文件夹"
    test_method: auto
  - id: "AC-005"
    description: "外部变化刷新"
    expected_result: "Given 映射文件夹内容被外部修改，When 变化发生，Then 分区内实时刷新"
    test_method: auto
  - id: "AC-006"
    description: "文件夹被删除提示"
    expected_result: "Given 映射文件夹已被删除，When 查看分区，Then 显示提示信息"
    test_method: auto

dependencies:
  internal: ["DO-001"]
  external: []
  blocked_by: []

ui_requirements:
