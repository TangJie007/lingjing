metadata:
  id: "WL-004"
  module: "壁纸库管理"
  feature: "壁纸收藏与标签分类"
  version: "2.0.0"
  status: draft
  priority: P1
  created_at: "2026-06-15"
  updated_at: "2026-06-15"
  author: "AI"
  prd_source: "AI动态桌面_V2_PRD.md"

description:
  summary: "壁纸库随使用积累会越来越大，V2 新增收藏和标签分类能力，让用户快速找到想要的壁纸。"
  detail: >
    支持一键收藏（♥ 按钮）、自定义标签（1-5 个）、AI 自动标签（来自构建方案的风格标签）。
    壁纸库顶部可按标签过滤展示，支持搜索框按名称/标签/AI描述关键词搜索。
  scope: "收藏功能、自定义标签、AI 自动标签、标签筛选、关键词搜索"

user_stories:
  - id: "US-001"
    role: "用户"
    action: "收藏壁纸"
    goal: "快速找到喜欢的壁纸"
    priority: P1
  - id: "US-002"
    role: "用户"
    action: "给壁纸打标签"
    goal: "按类别筛选壁纸"
    priority: P1
  - id: "US-003"
    role: "用户"
    action: "搜索壁纸"
    goal: "快速定位目标壁纸"
    priority: P1

acceptance_criteria:
  - id: "AC-001"
    description: "收藏按钮"
    expected_result: "Given 用户在壁纸库，When 点击卡片上的 ♥ 按钮，Then 切换收藏状态"
    test_method: auto
  - id: "AC-002"
    description: "收藏筛选"
    expected_result: "Given 用户收藏了壁纸，When 点击「♥ 收藏」筛选标签，Then 只显示收藏壁纸"
    test_method: auto
  - id: "AC-003"
    description: "自定义标签"
    expected_result: "Given 用户在壁纸详情/卡片菜单，When 添加标签，Then 可为壁纸添加 1-5 个自定义标签"
    test_method: auto
  - id: "AC-004"
    description: "AI 自动标签"
    expected_result: "Given AI 生成壁纸完成，When 入库，Then 自动打上风格标签（来自构建方案）"
    test_method: auto
  - id: "AC-005"
    description: "标签筛选"
    expected_result: "Given 壁纸库有标签，When 点击顶部标签，Then 按标签过滤展示"
    test_method: auto
  - id: "AC-006"
    description: "搜索功能"
    expected_result: "Given 用户在搜索框输入关键词，When 搜索，Then 按名称/标签/AI描述关键词匹配"
    test_method: auto

dependencies:
  internal: ["WL-001"]
  external: []
  blocked_by: []

ui_requirements:
  pages: ["壁纸库页"]
  components: ["收藏按钮", "标签筛选栏", "搜索框", "标签编辑面板"]

changelog:
  - version: "2.0.0"
    date: "2026-06-15"
    changes:
      - type: added
        field: "*"
        new_value: "V2 新增壁纸收藏与标签分类——收藏、自定义标签、AI 自动标签、搜索筛选"
        reason: "V1 遗漏 R-09，壁纸库日益增大需要分类管理"
