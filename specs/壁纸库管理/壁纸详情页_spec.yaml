metadata:
  id: WL-003
  module: 壁纸库管理
  feature: 壁纸详情页
  version: 2.0.0
  status: implemented
  priority: P0
  created_at: '2026-06-15'
  updated_at: '2026-06-15'
  author: AI
  prd_source: AI动态桌面_V2_PRD.md
description:
  summary: 点击任意壁纸卡片进入全屏或侧边栏详情页，展示大图预览 + 完整元数据 + 操作按钮。
  detail: >
    AI 生成壁纸额外展示原始描述、优化 Prompt、风格标签、色调色块、AI 模型信息。 动态壁纸在详情页自动播放（静音），有播放进度条 + 暂停/播放控制。
    支持键盘快捷键：空格=暂停/播放，左右箭头=上/下一张壁纸，Esc=返回。
  scope: 大图预览、元数据面板、AI 方案信息展示、动态播放控制、键盘快捷键
