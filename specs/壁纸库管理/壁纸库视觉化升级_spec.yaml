  - id: US-001
    role: 用户
    action: 浏览壁纸库
    goal: 以卡片缩略图网格快速预览和选择壁纸
    priority: P0
  - id: US-002
    role: 用户
    action: 查看动态壁纸卡片
    goal: 通过缩略图和类型角标区分静态/动态壁纸
    priority: P0
  - id: US-003
    role: 用户
    action: hover 壁纸卡片
    goal: 动态壁纸自动播放预览以直观感受效果
    priority: P1
  - id: US-004
    role: 用户
    action: 切换排序方式
    goal: 最新导入的壁纸排在最前面
    priority: P0
