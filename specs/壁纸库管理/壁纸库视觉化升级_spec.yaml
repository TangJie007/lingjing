metadata:
  id: WL-002
  module: 壁纸库管理
  feature: 壁纸库视觉化升级
  version: 2.0.0
  status: implemented
  priority: P0
  created_at: '2026-06-15'
  updated_at: '2026-06-15'
  author: AI
  prd_source: AI动态桌面_V2_PRD.md
description:
  summary: V1 壁纸库以列表/文字为主，缺乏直观预览。V2 全面升级为卡片缩略图网格模式，所有类型壁纸都必须有图片展示。
  detail: >
    支持网格/列表双视图切换、三档卡片尺寸（大/中/小）、hover 动态预览（静音）。 MP4/WebM 导入时自动截取第 0.5 秒帧生成 WebP 缩略图，GIF 截取第一帧。
    默认按导入时间降序排列，支持按名称、文件大小、最近使用排序。 AI 生成壁纸的入库时间 = 生成完成时间，与导入壁纸统一排序。
  scope: 卡片缩略图网格、缩略图自动生成、hover 动态预览、多维度排序、视图切换
