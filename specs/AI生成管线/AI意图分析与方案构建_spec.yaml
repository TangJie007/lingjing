metadata:
  id: "AI-001"
  module: "AI生成管线"
  feature: "AI意图分析与方案构建"
  version: "1.0.0"
  status: draft
  priority: P0
  created_at: "2026-06-12"
  updated_at: "2026-06-12"
  author: "AI"
  prd_source: "AI动态桌面_V1_PRD.md"

description:
  summary: "用户输入中文描述（可上传参考图），VL-LLM分析意图并输出结构化的动态桌面构建方案"
  detail: >
    第一步AI管线：将用户文字描述 + 可选参考图发送给 doubao-2.0-vision（有参考图时）或
    doubao-2.0-lite-32k（纯文字时）。VL-LLM理解意图、分析参考图风格要素，输出结构化
    「动态桌面构建方案」：优化后的英文prompt + 风格标签 + 色调建议 + 构图方向。
  scope: "纯文字描述分析、参考图风格提取、结构化构建方案输出"

user_stories:
  - id: "US-01"
    role: "桌面美化爱好者"
    action: "用一句话描述（如'赛博朋克雨天小巷'），AI就能理解我的意图并生成一张高质量壁纸"
    goal: "无需学习写prompt，用自然语言即可获得专业壁纸"
    priority: P0
  - id: "US-02"
    role: "有参考图的用户"
    action: "上传一张喜欢的图片，AI分析其风格后生成类似风格但完全不同的壁纸"
    goal: "以图搜图式创作，保持风格一致但内容创新"
    priority: P0

acceptance_criteria:
  - id: "AC-001"
    description: "纯文字描述分析"
    expected_result: "Given 用户输入中文描述'赛博朋克夜晚雨巷'，When 点击生成方案，Then 在3秒内返回优化后的英文prompt且风格标签准确"
    test_method: auto
  - id: "AC-002"
    description: "文字+参考图分析"
    expected_result: "Given 用户输入描述并上传参考图，When 点击生成方案，Then VL-LLM正确分析参考图的构图/色调/风格并融入构建方案"
    test_method: auto
  - id: "AC-003"
    description: "API Key无效处理"
    expected_result: "Given API Key无效，When 用户点击生成方案，Then 提示去设置页面配置API Key"
    test_method: auto
  - id: "AC-004"
    description: "网络错误处理"
    expected_result: "Given 网络断开，When 用户点击生成方案，Then 显示重试按钮和网络错误提示"
    test_method: auto

api_spec:
  endpoints:
    - method: POST
      path: "火山引擎 doubao-2.0-vision / doubao-2.0-lite-32k API"
      description: "发送用户描述+参考图，获取结构化构建方案"
      request:
        params:
          - name: "user_prompt"
            type: "string"
            required: true
            description: "用户输入的中文描述"
          - name: "reference_image"
            type: "file(base64)"
            required: false
            description: "可选参考图"
      response:
        success:
          optimized_prompt: "string"
          style_tags: "string[]"
          color_scheme: "string"
          composition: "string"

dependencies:
  internal: ["API-001"]
  external: ["火山引擎 doubao API"]
  blocked_by: []

non_functional:
  performance: "第一步分析响应时间 < 3秒"
  security: "用户描述仅通过API发送给模型提供商，本地不存储"
  availability: "依赖火山引擎API可用性"

ui_requirements:
  pages: ["AI创作页"]
  components: ["描述输入框", "参考图上传区", "风格快捷标签", "模型选择下拉", "生成按钮"]
  interaction_flow: "输入描述 → (可选)上传参考图 → 点击生成 → 展示构建方案卡片"

changelog:
  - version: "1.0.0"
    date: "2026-06-12"
    changes:
      - type: added
        field: "*"
        new_value: "初始版本，由PRD V1.3全量解析生成"
        reason: "首次解析AI动态桌面_V1_PRD.md"
