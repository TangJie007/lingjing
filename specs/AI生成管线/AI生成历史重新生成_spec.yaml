description:
  summary: 在壁纸详情页中，AI 生成的壁纸可以「用此方案重新生成」，支持微调后再次生成。
  detail: |
    点击「用此方案重新生成」后打开 AI 创作页面，预填原始描述、优化 Prompt、风格标签、模型。 用户可修改任意预填字段后点击生成，获得新一批变体。
  scope: 方案预填、微调重新生成、变体生成
