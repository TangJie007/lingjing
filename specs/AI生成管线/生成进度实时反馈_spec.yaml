metadata:
  id: "AI-005"
  module: "AI生成管线"
  feature: "生成进度实时反馈"
  version: "2.0.0"
  status: draft
  priority: P1
  created_at: "2026-06-15"
  updated_at: "2026-06-15"
  author: "AI"
  prd_source: "AI动态桌面_V2_PRD.md"

description:
  summary: "V1 生成时只有旋转动画，V2 做到清晰的分步进度反馈。"
  detail: >
    第一步显示 AI 意图分析状态和实际用时，第二步显示 Seedream 生成进度条和预计剩余时间。
    支持取消生成按钮，取消时提示可能已扣费。
  scope: "分步状态展示、进度条、预计剩余时间、取消生成"

user_stories:
  - id: "US-001"
    role: "用户"
    action: "查看 AI 生成进度"
    goal: "知道还要等多久"
    priority: P1

acceptance_criteria:
  - id: "AC-001"
    description: "第一步状态展示"
    expected_result: "Given AI 生成开始，When 第一步完成，Then 显示完成状态和实际用时"
    test_method: auto
  - id: "AC-002"
    description: "第二步进度条"
    expected_result: "Given 第二步生成中，When 查看进度，Then 显示进度条和预计剩余时间"
    test_method: auto
  - id: "AC-003"
    description: "取消生成"
    expected_result: "Given 生成进行中，When 用户点击取消，Then 提示可能已扣费并停止生成"
    test_method: auto

dependencies:
  internal: ["AI-001", "AI-003"]
  external: []
  blocked_by: []

ui_requirements:
  pages: ["AI 创作页"]
  components: ["分步进度面板", "进度条", "取消按钮"]

changelog:
  - version: "2.0.0"
    date: "2026-06-15"
    changes:
      - type: added
        field: "*"
        new_value: "V2 新增生成进度实时反馈——分步状态、进度条、预计时间、取消按钮"
        reason: "V1 遗漏 R-13，用户不知道生成进度"
