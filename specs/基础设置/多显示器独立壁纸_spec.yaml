metadata:
  id: "SET-008"
  module: "基础设置"
  feature: "多显示器独立壁纸"
  version: "2.0.0"
  status: draft
  priority: P1
  created_at: "2026-06-15"
  updated_at: "2026-06-15"
  author: "AI"
  prd_source: "AI动态桌面_V2_PRD.md"

description:
  summary: "检测到多显示器时，支持为每块屏幕独立设置不同壁纸（静态或动态）。"
  detail: >
    自动检测显示器数量，设置页展示每块屏幕的尺寸和当前壁纸预览。
    每块屏幕可独立选择壁纸。提供「所有显示器使用相同壁纸」开关，开启后同步设置。
  scope: "多显示器检测、每屏独立壁纸设置、同步开关"

user_stories:
  - id: "US-001"
    role: "多屏用户"
    action: "为每块屏幕设置不同壁纸"
    goal: "充分利用多显示器布局"
    priority: P1

acceptance_criteria:
  - id: "AC-001"
    description: "显示器检测与预览"
    expected_result: "Given 用户有多显示器，When 打开设置页，Then 自动检测显示器数量，展示每块屏幕的尺寸和当前壁纸预览"
    test_method: auto
  - id: "AC-002"
    description: "每屏独立设置"
    expected_result: "Given 用户在显示器配置页，When 为某屏幕选择壁纸，Then 该屏幕独立应用所选壁纸（静态或动态）"
    test_method: auto
  - id: "AC-003"
    description: "同步所有屏幕"
    expected_result: "Given 用户开启「所有显示器使用相同壁纸」开关，When 更换壁纸，Then 所有屏幕同步应用"
    test_method: auto

dependencies:
  internal: ["WP-001", "WP-002"]
  external: []
  blocked_by: []

ui_requirements:
  pages: ["设置页"]
  components: ["显示器配置面板", "壁纸选择器", "同步开关"]

changelog:
  - version: "2.0.0"
    date: "2026-06-15"
    changes:
      - type: added
        field: "*"
        new_value: "V2 新增多显示器独立壁纸——每屏独立设置、显示器配置界面"
