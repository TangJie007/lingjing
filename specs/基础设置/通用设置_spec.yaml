description:
  summary: "开机自启、语言切换（本期中文简体，预留i18n扩展），通过i18n框架实现"
  detail: >
    通用设置包含开机自启动开关和语言切换下拉。语言选项本期仅提供中文简体（zh-CN），
    切换通过 i18n 框架热切换实现（无需重启应用）。英文（en）作为预留扩展项显示在下拉中但标记为"即将推出"。
    所有 UI 文案通过 SET-005 国际化框架管理，本功能仅负责语言选择 UI。
  scope: "开机自启开关、语言选择下拉、语言持久化存储"

user_stories:
  - id: "US-001"
    role: "用户"
    action: "在设置中切换语言"
    goal: "使用自己熟悉的语言界面"
    priority: P1

acceptance_criteria:
  - id: "AC-001"
    description: "开机自启开关"
    expected_result: "Given 用户在设置页面，When 切换开机自启开关，Then 设置实时生效并持久化保存"
    test_method: auto
  - id: "AC-002"
    description: "语言切换热生效"
    expected_result: "Given 用户在设置页面切换语言为中文简体，When 确认切换，Then 所有UI文案即时更新，无需重启应用"
    test_method: auto
  - id: "AC-003"
    description: "语言选项本期仅中文简体"
    expected_result: "Given 用户打开语言下拉，When 查看选项，Then 显示'中文简体'可用 + 'English（即将推出）'灰色"
    test_method: auto

