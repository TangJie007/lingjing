description:
  summary: 应用启动时检测是否有新版本，有则通知用户。
  detail: |
    Steam 版依赖 Steam 自动更新，启动时仅展示版本号。 官网直售版启动后台请求版本接口（GitHub Release / 自建 JSON），有新版时顶部横幅提示 + 下载链接。
  scope: 版本检测、Steam/官网双渠道、更新横幅提示
user_stories:
  - id: US-001
    role: 用户
    action: 启动应用
    goal: 自动检测新版本以便及时更新
    priority: P0
