<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      * { box-sizing: border-box; }
      html, body, #stage, #apps, #files {
        margin: 0;
        border: none;
        outline: none;
        box-shadow: none;
        background: transparent;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
        user-select: none;
        color: #f4f6fb;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #apps {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 8px;
        max-width: calc(100% - min(420px, 32vw) - 56px);
        z-index: 1;
        padding: 28px 0 12px 16px;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-items: flex-start;
        align-content: flex-start;
        gap: 0 2px;
      }
      #files {
        position: absolute;
        right: 24px;
        top: 24px;
        bottom: 24px;
        width: min(420px, 32vw);
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        overflow-x: hidden;
        background: transparent;
        border: none;
        box-shadow: none;
        outline: none;
      }
      .fence {
        flex: 1 1 0;
        min-height: 160px;
        padding: 12px 12px 14px;
        border-radius: 16px;
        background: rgba(16, 18, 24, 0.42);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        overflow: auto;
        overscroll-behavior: contain;
      }
      .fence.fence-dragging {
        overflow: hidden;
      }
      .fence.compact {
        flex: 0 1 auto;
        min-height: 120px;
        max-height: 220px;
      }
      .drag-host.drag-over {
        outline: 2px dashed rgba(120, 180, 255, 0.75);
        outline-offset: -4px;
        border-radius: 12px;
        background: rgba(80, 140, 220, 0.08);
      }
      .fence-title {
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.82);
        padding: 2px 8px 10px;
      }
      .fence-grid {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 2px;
        touch-action: none;
      }
      .fence-empty {
        padding: 18px 8px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.38);
      }
      .cell {
        width: 84px;
        padding: 8px 4px 10px;
        border-radius: 10px;
        text-align: center;
        cursor: default;
        border: none;
        background: transparent;
      }
      .cell:hover { background: rgba(255, 255, 255, 0.12); }
      .cell:active { background: rgba(255, 255, 255, 0.18); }
      .cell.native {
        width: 76px;
        height: 88px;
        flex: 0 0 88px;
        padding: 4px 2px 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        border: none;
        outline: none;
        border-radius: 4px;
        background: transparent;
        box-shadow: none;
      }
      .cell.draggable {
        cursor: grab;
        touch-action: none;
        -webkit-user-drag: none;
        user-select: none;
      }
      .cell.draggable:active,
      .cell.draggable.is-dragging {
        cursor: grabbing !important;
      }
      .drag-host.group-dragging .cell.draggable:hover,
      .drag-host.group-dragging .cell.draggable:active {
        background: transparent;
      }
      .cell.draggable.is-dragging-source {
        visibility: hidden;
        cursor: grabbing !important;
      }
      .cell.draggable.swap-target {
        background: rgba(255, 255, 255, 0.2);
        outline: 1px dashed rgba(255, 255, 255, 0.55);
      }
      .drag-ghost {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.94;
        will-change: transform;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
      }
      .cell.draggable .icon,
      .cell.draggable .icon img,
      .cell.draggable .name {
        -webkit-user-drag: none;
        user-select: none;
        pointer-events: none;
      }
      .cell.native:hover,
      .cell.native:active,
      .cell.native:focus {
        border: none;
        outline: none;
        box-shadow: none;
        background: rgba(255, 255, 255, 0.14);
      }
      .cell.native .icon,
      .cell.native .icon img {
        -webkit-user-drag: none;
        user-select: none;
        pointer-events: none;
      }
      .cell.native .name {
        width: 100%;
        height: 30px;
        max-height: 30px;
        line-height: 15px;
        color: #fff;
        font-weight: 400;
        text-shadow:
          0 0 3px #000,
          1px 1px 1px #000,
          -1px 0 1px rgba(0, 0, 0, 0.7);
      }
      .cell.native .icon {
        margin: 0 auto 4px;
        flex: 0 0 48px;
      }
      .cell.native .icon img {
        filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, 0.45));
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 6px;
        display: grid;
        place-items: center;
        font-size: 28px;
        line-height: 1;
      }
      .icon.folder { font-size: 34px; }
      .icon img {
        max-width: 48px;
        max-height: 48px;
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
        image-rendering: auto;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.45));
      }
      .name {
        font-size: 12px;
        line-height: 15px;
        word-break: break-word;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85), 0 0 10px rgba(0, 0, 0, 0.35);
      }
      .ctx-menu {
        position: fixed;
        z-index: 10050;
        display: block;
        min-width: 168px;
        padding: 6px;
        border-radius: 10px;
        background: rgba(22, 24, 32, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        pointer-events: auto;
      }
      .ctx-menu.hidden {
        display: none;
      }
      .ctx-menu button {
        display: block;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #f4f6fb;
        font-size: 13px;
        text-align: left;
        cursor: default;
      }
      .ctx-menu button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .ctx-menu button.danger:hover {
        background: rgba(220, 80, 80, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="apps" class="drag-host"></div>
      <div id="files">
        <section class="fence" data-kind="image">
          <div class="fence-title">图片</div>
          <div class="fence-grid drag-host" id="images"></div>
        </section>
        <section class="fence" data-kind="document">
          <div class="fence-title">文档</div>
          <div class="fence-grid drag-host" id="documents"></div>
        </section>
        <section class="fence compact" data-kind="folder">
          <div class="fence-title">文件夹</div>
          <div class="fence-grid drag-host" id="folders"></div>
        </section>
        <section class="fence compact" data-kind="media">
          <div class="fence-title">媒体</div>
          <div class="fence-grid drag-host" id="media"></div>
        </section>
        <section class="fence compact" data-kind="archive">
          <div class="fence-title">压缩包</div>
          <div class="fence-grid drag-host" id="archives"></div>
        </section>
      </div>
    </div>
    <div id="ctx-menu" class="ctx-menu hidden" role="menu"></div>
    <script>
      const appsEl = document.getElementById("apps");
      const imagesEl = document.getElementById("images");
      const documentsEl = document.getElementById("documents");
      const foldersEl = document.getElementById("folders");
      const mediaEl = document.getElementById("media");
      const archivesEl = document.getElementById("archives");
      const ctxMenuEl = document.getElementById("ctx-menu");
      const APP_ORDER_KEY = "lingscape-fence-app-order";
      const IMAGE_ORDER_KEY = "lingscape-fence-image-order";
      const DOC_ORDER_KEY = "lingscape-fence-document-order";
      const FOLDER_ORDER_KEY = "lingscape-fence-folder-order";
      const MEDIA_ORDER_KEY = "lingscape-fence-media-order";
      const ARCHIVE_ORDER_KEY = "lingscape-fence-archive-order";
      const CATEGORY_KEY = "lingscape-fence-category";

      const groups = {
        app: { key: "app", container: appsEl, orderKey: APP_ORDER_KEY, items: [] },
        image: { key: "image", container: imagesEl, orderKey: IMAGE_ORDER_KEY, items: [] },
        document: { key: "document", container: documentsEl, orderKey: DOC_ORDER_KEY, items: [] },
        folder: { key: "folder", container: foldersEl, orderKey: FOLDER_ORDER_KEY, items: [] },
        media: { key: "media", container: mediaEl, orderKey: MEDIA_ORDER_KEY, items: [] },
        archive: { key: "archive", container: archivesEl, orderKey: ARCHIVE_ORDER_KEY, items: [] },
      };

      let lastItems = [];

      let activeDrag = null;
      let dragListenersBound = false;
      let pendingFenceItems = null;

      function fenceSectionFor(container) {
        return container.closest?.(".fence") || null;
      }

      function flushPendingFenceItems() {
        if (!pendingFenceItems || activeDrag) return;
        const items = pendingFenceItems;
        pendingFenceItems = null;
        render(items);
      }

      function onDocumentPointerMove(e) {
        if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;
        onDragMove(e);
      }

      function onDocumentPointerEnd(e) {
        if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;
        finishDrag(e);
      }

      function bindDragListeners() {
        if (dragListenersBound) return;
        dragListenersBound = true;
        document.addEventListener("pointermove", onDocumentPointerMove);
        document.addEventListener("pointerup", onDocumentPointerEnd);
        document.addEventListener("pointercancel", onDocumentPointerEnd);
        document.addEventListener("lostpointercapture", onDocumentPointerEnd);
        document.addEventListener("wheel", onDocumentWheel, { passive: false });
      }

      function unbindDragListeners() {
        if (!dragListenersBound) return;
        dragListenersBound = false;
        document.removeEventListener("pointermove", onDocumentPointerMove);
        document.removeEventListener("pointerup", onDocumentPointerEnd);
        document.removeEventListener("pointercancel", onDocumentPointerEnd);
        document.removeEventListener("lostpointercapture", onDocumentPointerEnd);
        document.removeEventListener("wheel", onDocumentWheel);
      }

      function onDocumentWheel(e) {
        if (activeDrag) e.preventDefault();
      }

      function saveOrder(key, paths) {
        try {
          localStorage.setItem(key, JSON.stringify(paths));
        } catch (_) {}
      }

      function loadOrder(key, items) {
        try {
          const saved = JSON.parse(localStorage.getItem(key) || "[]");
          const map = new Map(items.map((a) => [a.path, a]));
          const out = [];
          for (const p of saved) {
            if (typeof p !== "string" || p.startsWith("::")) continue;
            if (map.has(p)) {
              out.push(map.get(p));
              map.delete(p);
            }
          }
          for (const a of items) {
            if (map.has(a.path)) out.push(a);
          }
          return out;
        } catch (_) {
          return items;
        }
      }

      function loadCategoryOverrides() {
        try {
          const raw = JSON.parse(localStorage.getItem(CATEGORY_KEY) || "{}");
          return raw && typeof raw === "object" ? raw : {};
        } catch (_) {
          return {};
        }
      }

      function saveCategoryOverride(path, category) {
        try {
          const map = loadCategoryOverrides();
          map[path] = category;
          localStorage.setItem(CATEGORY_KEY, JSON.stringify(map));
        } catch (_) {}
      }

      function effectiveCategory(item) {
        if (!item) return "other";
        const overrides = loadCategoryOverrides();
        if (overrides[item.path]) return overrides[item.path];
        return item.kind || "other";
      }

      function groupForContainer(container) {
        if (!container) return null;
        for (const group of Object.values(groups)) {
          if (group.container === container) return group;
        }
        return null;
      }

      function groupForCell(cell) {
        const host = cell?.closest?.(".drag-host");
        return groupForContainer(host);
      }

      function groupAtPoint(x, y) {
        for (const el of document.elementsFromPoint(x, y)) {
          const host = el.closest?.(".drag-host");
          const group = groupForContainer(host);
          if (group) return group;
        }
        return null;
      }

      function findItem(path) {
        for (const group of Object.values(groups)) {
          const item = group.items.find((i) => i.path === path);
          if (item) return item;
        }
        return lastItems.find((i) => i.path === path) || null;
      }

      function canDropOnGroup(item, group) {
        if (!item || !group || item.builtin) return false;
        if (group.key === "app") return effectiveCategory(item) === "app";
        return group.key !== "app";
      }

      function clearDragOverHosts() {
        document.querySelectorAll(".drag-host.drag-over").forEach((el) => {
          el.classList.remove("drag-over");
        });
      }

      function updateDragOverHost(x, y, sourceGroup, itemPath) {
        clearDragOverHosts();
        const item = findItem(itemPath);
        const targetGroup = groupAtPoint(x, y);
        if (!targetGroup || targetGroup === sourceGroup || !canDropOnGroup(item, targetGroup)) return;
        targetGroup.container.classList.add("drag-over");
      }

      function cellForPath(container, path) {
        for (const cell of container.querySelectorAll(".cell[data-path]")) {
          if (cell.dataset.path === path) return cell;
        }
        return null;
      }

      function swapDomNodes(a, b) {
        if (a === b) return;
        const parent = a.parentNode;
        if (!parent || b.parentNode !== parent) return;
        const aNext = a.nextSibling;
        const bNext = b.nextSibling;
        if (aNext === b) {
          parent.insertBefore(b, a);
          return;
        }
        if (bNext === a) {
          parent.insertBefore(a, b);
          return;
        }
        parent.insertBefore(a, bNext);
        parent.insertBefore(b, aNext);
      }

      function syncItemsFromDom(group) {
        const map = new Map(group.items.map((i) => [i.path, i]));
        const next = [];
        for (const cell of group.container.querySelectorAll(".cell[data-path]")) {
          const item = map.get(cell.dataset.path);
          if (item) next.push(item);
        }
        group.items = next;
      }

      function findSwapTarget(x, y, sourceCell) {
        for (const el of document.elementsFromPoint(x, y)) {
          const cell = el.closest?.(".cell.draggable");
          if (cell && cell !== sourceCell) return cell;
        }
        let host = null;
        for (const el of document.elementsFromPoint(x, y)) {
          const h = el.closest?.(".drag-host");
          if (h) {
            host = h;
            break;
          }
        }
        if (!host) return null;
        let best = null;
        let bestDist = Infinity;
        for (const cell of host.querySelectorAll(".cell.draggable")) {
          if (cell === sourceCell) continue;
          const rect = cell.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dist = Math.hypot(x - cx, y - cy);
          if (dist < bestDist) {
            bestDist = dist;
            best = cell;
          }
        }
        if (best && bestDist < 56) return best;
        return null;
      }

      function showGroupEmpty(group, text) {
        group.container.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "fence-empty";
        empty.textContent = text;
        group.container.appendChild(empty);
      }

      function moveItemToGroup(fromGroup, toGroup, path, beforePath) {
        const item = fromGroup.items.find((i) => i.path === path);
        if (!item || !canDropOnGroup(item, toGroup)) return false;

        saveCategoryOverride(path, toGroup.key);

        const fromCell = cellForPath(fromGroup.container, path);
        if (fromCell) fromCell.remove();
        fromGroup.items = fromGroup.items.filter((i) => i.path !== path);
        syncItemsFromDom(fromGroup);
        saveOrder(
          fromGroup.orderKey,
          fromGroup.items.filter((a) => !a.builtin).map((a) => a.path),
        );
        if (!fromGroup.items.length) {
          showGroupEmpty(fromGroup, emptyTextFor(fromGroup.key));
        }

        const moved = { ...item, kind: toGroup.key };
        if (beforePath) {
          const idx = toGroup.items.findIndex((i) => i.path === beforePath);
          if (idx >= 0) toGroup.items.splice(idx, 0, moved);
          else toGroup.items.push(moved);
        } else {
          toGroup.items.push(moved);
        }

        if (toGroup.container.querySelector(".fence-empty")) {
          toGroup.container.innerHTML = "";
        }
        const newCell = makeCell(moved, toGroup.key === "app", toGroup);
        if (beforePath) {
          const beforeCell = cellForPath(toGroup.container, beforePath);
          if (beforeCell) toGroup.container.insertBefore(newCell, beforeCell);
          else toGroup.container.appendChild(newCell);
        } else {
          toGroup.container.appendChild(newCell);
        }
        syncItemsFromDom(toGroup);
        saveOrder(
          toGroup.orderKey,
          toGroup.items.filter((a) => !a.builtin).map((a) => a.path),
        );
        return true;
      }

      function emptyTextFor(key) {
        const map = {
          image: "暂无图片",
          document: "暂无文档",
          folder: "暂无文件夹",
          media: "暂无媒体",
          archive: "暂无压缩包",
        };
        return map[key] || "";
      }

      function swapInPlace(group, fromPath, toPath) {
        const { container, items, orderKey } = group;
        const fromItem = items.find((a) => a.path === fromPath);
        const toItem = items.find((a) => a.path === toPath);
        if (!fromItem || !toItem || fromPath === toPath) return;
        if (fromItem.builtin || toItem.builtin) return;

        const fromCell = cellForPath(container, fromPath);
        const toCell = cellForPath(container, toPath);
        if (!fromCell || !toCell || fromCell === toCell) return;

        swapDomNodes(fromCell, toCell);
        syncItemsFromDom(group);
        saveOrder(
          orderKey,
          group.items.filter((a) => !a.builtin).map((a) => a.path),
        );
      }

      function beginDragVisuals(drag) {
        drag.group.container.classList.add("group-dragging");
        drag.fenceSection = fenceSectionFor(drag.group.container);
        if (drag.fenceSection) drag.fenceSection.classList.add("fence-dragging");
        drag.cell.classList.add("is-dragging-source");
        document.body.style.cursor = "grabbing";
        drag.ghost = createDragGhost(drag.cell);
        const rect = drag.cell.getBoundingClientRect();
        drag.offsetX = drag.startX - rect.left;
        drag.offsetY = drag.startY - rect.top;
      }

      function endDragVisuals(drag) {
        drag.group.container.classList.remove("group-dragging");
        if (drag.fenceSection) drag.fenceSection.classList.remove("fence-dragging");
        document.body.style.cursor = "";
        if (drag.swapTarget) drag.swapTarget.classList.remove("swap-target");
        drag.cell.classList.remove("is-dragging-source", "is-dragging");
        clearDragOverHosts();
      }

      function createDragGhost(cell) {
        const ghost = cell.cloneNode(true);
        ghost.classList.add("drag-ghost");
        ghost.classList.remove("is-dragging-source", "swap-target", "is-dragging");
        const rect = cell.getBoundingClientRect();
        ghost.style.width = `${rect.width}px`;
        ghost.style.height = `${rect.height}px`;
        document.body.appendChild(ghost);
        return ghost;
      }

      function animateGhostBack(ghost, cell, done) {
        const rect = cell.getBoundingClientRect();
        ghost.style.transition = "transform 180ms ease, opacity 180ms ease";
        ghost.style.transform = `translate(${rect.left}px, ${rect.top}px)`;
        ghost.style.opacity = "0";
        window.setTimeout(() => {
          ghost.remove();
          done();
        }, 190);
      }

      function cellPreviewDataUrl(cell) {
        const img = cell.querySelector("img");
        const src = img?.src || "";
        return src.startsWith("data:image/png;base64,") ? src : null;
      }

      function onDragMove(e) {
        const drag = activeDrag;
        if (!drag || drag.shellPending) return;
        drag.lastButtons = e.buttons;
        drag.ctrlKey = !!e.ctrlKey;
        drag.shiftKey = !!e.shiftKey;

        const dx = e.clientX - drag.startX;
        const dy = e.clientY - drag.startY;
        if (!drag.moved && Math.hypot(dx, dy) < 6) return;

        if (!drag.moved) {
          drag.moved = true;
          beginDragVisuals(drag);
        }

        if (drag.ghost) {
          drag.ghost.style.transform = `translate(${e.clientX - drag.offsetX}px, ${e.clientY - drag.offsetY}px)`;
        }

        const target = findSwapTarget(e.clientX, e.clientY, drag.cell);
        if (drag.swapTarget && drag.swapTarget !== target) {
          drag.swapTarget.classList.remove("swap-target");
        }
        drag.swapTarget = target;
        if (drag.swapTarget) {
          drag.swapTarget.classList.add("swap-target");
          drag.foreignHits = 0;
        }
        updateDragOverHost(e.clientX, e.clientY, drag.group, drag.itemPath);

        // Fullscreen fence: leaving for another app is detected via Win32 hit-test.
        // Prefer icon swap when hovering a peer; otherwise try shell file drag-out.
        if (!target) {
          const now = performance.now();
          if (!drag.lastForeignProbe || now - drag.lastForeignProbe > 45) {
            drag.lastForeignProbe = now;
            void maybeStartShellDrag(drag);
          }
        }
      }

      async function maybeStartShellDrag(drag) {
        if (!drag || drag.shellPending || drag.probeInFlight || !window.__TAURI__) return;
        if (drag.swapTarget) return;
        if ((drag.lastButtons & 1) === 0) return;

        drag.probeInFlight = true;
        try {
          const foreign = await window.__TAURI__.core.invoke("is_desktop_drag_over_foreign");
          if (activeDrag !== drag || drag.shellPending || drag.swapTarget) return;
          if ((drag.lastButtons & 1) === 0) return;

          if (!foreign) {
            drag.foreignHits = 0;
            return;
          }

          drag.foreignHits = (drag.foreignHits || 0) + 1;
          // Require sustained foreign hover to avoid accidental shell drag.
          if (drag.foreignHits < 2) return;

          drag.shellPending = true;
          const path = drag.itemPath;
          const mode = drag.shiftKey ? "move" : "copy";
          const previewDataUrl = cellPreviewDataUrl(drag.cell);

          activeDrag = null;
          unbindDragListeners();
          try {
            drag.cell.releasePointerCapture(drag.pointerId);
          } catch (_) {}
          if (drag.ghost) drag.ghost.remove();
          endDragVisuals(drag);

          try {
            await window.__TAURI__.core.invoke("start_desktop_file_drag", {
              path,
              mode,
              previewDataUrl,
            });
          } catch (err) {
            console.warn("shell file drag failed", err);
          } finally {
            flushPendingFenceItems();
          }
        } catch (err) {
          console.warn("foreign drag probe failed", err);
          if (activeDrag === drag) drag.foreignHits = 0;
        } finally {
          if (activeDrag === drag) drag.probeInFlight = false;
        }
      }

      function finishDrag(e) {
        const drag = activeDrag;
        if (!drag) return;
        activeDrag = null;
        unbindDragListeners();

        try {
          drag.cell.releasePointerCapture(e.pointerId);
        } catch (_) {}

        if (!drag.moved) {
          endDragVisuals(drag);
          if (drag.ghost) drag.ghost.remove();
          flushPendingFenceItems();
          return;
        }

        if (drag.shellPending) {
          endDragVisuals(drag);
          if (drag.ghost) drag.ghost.remove();
          flushPendingFenceItems();
          return;
        }

        const targetCell = findSwapTarget(e.clientX, e.clientY, drag.cell);
        if (targetCell) {
          const targetGroup = groupForCell(targetCell);
          const toPath = targetCell.dataset?.path || "";
          const fromItem = drag.group.items.find((a) => a.path === drag.itemPath);
          const toItem = toPath ? findItem(toPath) : null;

          if (
            targetGroup === drag.group &&
            fromItem &&
            toItem &&
            toPath &&
            toPath !== drag.itemPath &&
            !fromItem.builtin &&
            !toItem.builtin
          ) {
            swapInPlace(drag.group, drag.itemPath, toPath);
          } else if (
            targetGroup &&
            targetGroup !== drag.group &&
            canDropOnGroup(fromItem, targetGroup)
          ) {
            moveItemToGroup(drag.group, targetGroup, drag.itemPath, toPath);
          }
          if (drag.ghost) drag.ghost.remove();
          endDragVisuals(drag);
          flushPendingFenceItems();
          return;
        }

        const dropGroup = groupAtPoint(e.clientX, e.clientY);
        const fromItem = drag.group.items.find((a) => a.path === drag.itemPath);
        if (
          dropGroup &&
          dropGroup !== drag.group &&
          canDropOnGroup(fromItem, dropGroup)
        ) {
          moveItemToGroup(drag.group, dropGroup, drag.itemPath, null);
          if (drag.ghost) drag.ghost.remove();
          endDragVisuals(drag);
          flushPendingFenceItems();
          return;
        }

        if (drag.ghost) {
          animateGhostBack(drag.ghost, drag.cell, () => {
            endDragVisuals(drag);
            flushPendingFenceItems();
          });
        } else {
          endDragVisuals(drag);
          flushPendingFenceItems();
        }
      }

      function setupCellDrag(cell, item, group) {
        cell.dataset.path = item.path;
        cell.addEventListener("dragstart", (e) => e.preventDefault());
        cell.addEventListener("selectstart", (e) => e.preventDefault());

        cell.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          if (activeDrag) return;
          e.preventDefault();
          e.stopPropagation();
          const fromIndex = group.items.findIndex((a) => a.path === item.path);
          if (fromIndex < 0 || item.builtin) return;
          try {
            cell.setPointerCapture(e.pointerId);
          } catch (_) {}
          bindDragListeners();
          activeDrag = {
            group,
            cell,
            itemPath: item.path,
            fenceSection: null,
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            moved: false,
            ghost: null,
            swapTarget: null,
            shellPending: false,
            probeInFlight: false,
            foreignHits: 0,
            lastForeignProbe: 0,
            lastButtons: e.buttons,
            ctrlKey: !!e.ctrlKey,
            shiftKey: !!e.shiftKey,
          };
          cell.classList.add("is-dragging");
        });
      }

      function iconFor(item) {
        if (item?.isDir && !item?.builtin) return "📁";
        const ext = (item.name.split(".").pop() || "").toLowerCase();
        const map = {
          lnk: "🔗", exe: "⚙️", txt: "📄", pdf: "📕",
          doc: "📘", docx: "📘", xls: "📗", xlsx: "📗",
          ppt: "📙", pptx: "📙", zip: "🗜️", rar: "🗜️",
          png: "🖼️", jpg: "🖼️", jpeg: "🖼️", gif: "🖼️",
          webp: "🖼️", mp4: "🎬", mp3: "🎵",
        };
        return map[ext] || "📄";
      }

      async function openItem(path) {
        if (!window.__TAURI__) return;
        try {
          await window.__TAURI__.core.invoke("open_desktop_item", { path });
        } catch (e) {
          console.warn("open failed", e);
        }
      }

      const BUILTIN_ORDER = [
        "20D04FE0-3AEA-1069-A2D8-08002B30309D",
        "645FF040-5081-101B-9F08-00AA002F954E",
        "F02C1A0D-B21F-4110-8426-0A0C959C3602",
      ];

      function builtinRank(path) {
        const upper = String(path || "").toUpperCase();
        const idx = BUILTIN_ORDER.findIndex((id) => upper.includes(id));
        return idx >= 0 ? idx : 99;
      }

      function partitionByCategory(list) {
        const buckets = {
          image: [],
          document: [],
          folder: [],
          media: [],
          archive: [],
        };
        for (const item of list) {
          if (item.builtin) continue;
          const cat = effectiveCategory(item);
          if (cat === "app") continue;
          if (buckets[cat]) buckets[cat].push(item);
          else buckets.document.push(item);
        }
        return buckets;
      }

      function partitionApps(list) {
        const builtins = [];
        const regular = [];
        for (const item of list) {
          const cat = effectiveCategory(item);
          if (cat !== "app") continue;
          if (item.builtin) builtins.push(item);
          else regular.push(item);
        }
        builtins.sort((a, b) => builtinRank(a.path) - builtinRank(b.path));
        return [...builtins, ...loadOrder(APP_ORDER_KEY, regular)];
      }

      function applyAppInset() {
        const apps = document.getElementById("apps");
        if (!apps) return;
        apps.style.paddingTop = "28px";
        apps.style.paddingLeft = "16px";
      }

      function makeCell(item, native, group) {
        const cell = document.createElement("div");
        const draggable = group && !item.builtin;
        cell.className = native
          ? `cell native${draggable ? " draggable" : ""}`
          : `cell${draggable ? " draggable" : ""}`;
        cell.title = item.path;
        const iconWrap = document.createElement("div");
        iconWrap.className = "icon" + (item.isDir && !item.builtin ? " folder" : "");
        if (item.icon) {
          const img = document.createElement("img");
          img.alt = "";
          img.draggable = false;
          img.addEventListener("dragstart", (ev) => ev.preventDefault());
          img.src = item.icon;
          iconWrap.appendChild(img);
        } else {
          iconWrap.textContent = iconFor(item);
        }
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = item.name;
        cell.appendChild(iconWrap);
        cell.appendChild(name);
        cell.addEventListener("dblclick", () => openItem(item.path));
        bindCellContextMenu(cell, item);
        if (group && !item.builtin) setupCellDrag(cell, item, group);
        return cell;
      }

      function renderGroup(group, items, native, emptyText) {
        group.items = items;
        group.container.innerHTML = "";
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "fence-empty";
          empty.textContent = emptyText;
          group.container.appendChild(empty);
          return;
        }
        for (const item of items) {
          group.container.appendChild(makeCell(item, native, group));
        }
      }

      function renderApps(apps) {
        renderGroup(groups.app, apps, true, "");
      }

      function fillGrid(group, items, emptyText) {
        renderGroup(group, items, false, emptyText);
      }

      function render(items) {
        applyAppInset();
        const list = items || [];
        lastItems = list;
        const apps = partitionApps(list);
        const buckets = partitionByCategory(list);
        renderApps(apps);
        fillGrid(groups.image, loadOrder(IMAGE_ORDER_KEY, buckets.image), "暂无图片");
        fillGrid(groups.document, loadOrder(DOC_ORDER_KEY, buckets.document), "暂无文档");
        fillGrid(groups.folder, loadOrder(FOLDER_ORDER_KEY, buckets.folder), "暂无文件夹");
        fillGrid(groups.media, loadOrder(MEDIA_ORDER_KEY, buckets.media), "暂无媒体");
        fillGrid(groups.archive, loadOrder(ARCHIVE_ORDER_KEY, buckets.archive), "暂无压缩包");
      }

      function bindCellContextMenu(cell, item) {
        let lastOpenAt = 0;
        const open = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const now = Date.now();
          if (now - lastOpenAt < 250) return;
          lastOpenAt = now;
          showContextMenu(e.clientX, e.clientY, item);
        };
        cell.addEventListener("contextmenu", open);
        cell.addEventListener("pointerdown", (e) => {
          if (e.button !== 2) return;
          open(e);
        });
      }

      let ctxItem = null;

      function hideContextMenu() {
        ctxMenuEl.classList.add("hidden");
        ctxItem = null;
      }

      function showContextMenu(x, y, item) {
        ctxItem = item;
        const builtin = item.builtin || String(item.path || "").startsWith("::");
        const actions = builtin
          ? [{ id: "open", label: "打开" }]
          : [
              { id: "open", label: "打开" },
              { id: "openWith", label: "打开方式" },
              { id: "showInFolder", label: "在文件夹中显示" },
              { id: "rename", label: "重命名" },
              { id: "delete", label: "删除", danger: true },
              { id: "properties", label: "属性" },
            ];
        ctxMenuEl.innerHTML = "";
        for (const act of actions) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = act.label;
          if (act.danger) btn.classList.add("danger");
          const run = (e) => {
            e.preventDefault();
            e.stopPropagation();
            runContextAction(act.id, item);
          };
          btn.addEventListener("pointerdown", run);
          ctxMenuEl.appendChild(btn);
        }
        ctxMenuEl.classList.remove("hidden");
        const pad = 8;
        let left = x;
        let top = y;
        ctxMenuEl.style.left = `${left}px`;
        ctxMenuEl.style.top = `${top}px`;
        const rect = ctxMenuEl.getBoundingClientRect();
        if (left + rect.width > window.innerWidth - pad) {
          left = window.innerWidth - rect.width - pad;
        }
        if (top + rect.height > window.innerHeight - pad) {
          top = window.innerHeight - rect.height - pad;
        }
        ctxMenuEl.style.left = `${left}px`;
        ctxMenuEl.style.top = `${top}px`;
      }

      async function refreshDesktop() {
        if (!window.__TAURI__) return;
        try {
          await window.__TAURI__.core.invoke("refresh_desktop_organize");
        } catch (e) {
          console.warn("refresh_desktop_organize failed", e);
        }
      }

      async function runContextAction(action, item) {
        hideContextMenu();
        if (!window.__TAURI__) return;
        const path = item.path;
        try {
          switch (action) {
            case "open":
              await openItem(path);
              break;
            case "openWith":
              await window.__TAURI__.core.invoke("open_desktop_item_with", { path });
              break;
            case "showInFolder":
              await window.__TAURI__.core.invoke("show_desktop_item_in_folder", { path });
              break;
            case "rename": {
              const newName = prompt("新名称", item.name);
              if (!newName || newName.trim() === item.name) return;
              const trimmed = newName.trim();
              const overrides = loadCategoryOverrides();
              const oldCat = overrides[path];
              await window.__TAURI__.core.invoke("rename_desktop_item", {
                path,
                newName: trimmed,
              });
              if (oldCat) {
                const sep = path.includes("\\") ? "\\" : "/";
                const parent = path.includes(sep) ? path.slice(0, path.lastIndexOf(sep) + 1) : "";
                delete overrides[path];
                overrides[parent + trimmed] = oldCat;
                localStorage.setItem(CATEGORY_KEY, JSON.stringify(overrides));
              }
              await refreshDesktop();
              break;
            }
            case "delete": {
              if (!confirm(`确定删除「${item.name}」？将移入回收站。`)) return;
              await window.__TAURI__.core.invoke("delete_desktop_item", { path });
              await refreshDesktop();
              break;
            }
            case "properties":
              await window.__TAURI__.core.invoke("open_desktop_item_properties", { path });
              break;
          }
        } catch (e) {
          console.warn("context action failed", e);
          const msg = typeof e === "string" ? e : e?.message || "操作失败";
          alert(msg);
        }
      }

      document.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        if (!ctxMenuEl.contains(e.target)) hideContextMenu();
      });
      document.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        if (!ctxMenuEl.contains(e.target)) hideContextMenu();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") hideContextMenu();
      });

      function applyFenceItems(items) {
        if (activeDrag) {
          pendingFenceItems = items || [];
          return;
        }
        pendingFenceItems = null;
        render(items);
      }

      window.__fenceApply = applyFenceItems;

      async function boot() {
        if (!window.__TAURI__) return;
        try {
          const items = await window.__TAURI__.core.invoke("list_desktop_items");
          applyFenceItems(items);
        } catch (e) {
          console.warn("list_desktop_items failed", e);
        }
        try {
          await window.__TAURI__.event.listen("fence-items", (e) =>
            applyFenceItems(e.payload || []),
          );
        } catch (e) {
          console.warn("listen fence-items failed", e);
        }
      }
      applyAppInset();
      boot();
    </script>
  </body>
</html>
