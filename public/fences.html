<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Fence</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1e26;
        font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
        user-select: none;
        color: #f2f4f8;
      }
      #panel {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, rgba(32, 36, 46, 0.96), rgba(22, 24, 30, 0.96));
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      #title {
        flex: 0 0 auto;
        padding: 12px 16px 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.78);
      }
      #grid {
        flex: 1;
        overflow: auto;
        padding: 4px 10px 16px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 2px;
      }
      .cell {
        width: 88px;
        padding: 8px 4px 10px;
        border-radius: 10px;
        text-align: center;
        cursor: default;
      }
      .cell:hover { background: rgba(255, 255, 255, 0.1); }
      .cell:active { background: rgba(255, 255, 255, 0.16); }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 6px;
        display: grid;
        place-items: center;
        font-size: 28px;
        line-height: 1;
      }
      .icon.folder { font-size: 34px; }
      .icon img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        display: block;
        image-rendering: auto;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
      }
      .name {
        font-size: 12px;
        line-height: 1.25;
        word-break: break-all;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #empty {
        margin: 40px auto;
        color: rgba(255, 255, 255, 0.45);
        font-size: 13px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="title">桌面</div>
      <div id="grid"></div>
      <div id="empty">桌面暂无文件</div>
    </div>
    <script>
      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");

      function iconFor(item) {
        if (item.isDir) return "📁";
        const ext = (item.name.split(".").pop() || "").toLowerCase();
        const map = {
          lnk: "🔗", exe: "⚙️", txt: "📄", pdf: "📕",
          doc: "📘", docx: "📘", xls: "📗", xlsx: "📗",
          ppt: "📙", pptx: "📙", zip: "🗜️", rar: "🗜️",
          png: "🖼️", jpg: "🖼️", jpeg: "🖼️", gif: "🖼️",
          webp: "🖼️", mp4: "🎬", mp3: "🎵",
        };
        return map[ext] || "📄";
      }

      async function openItem(path) {
        if (!window.__TAURI__) return;
        try {
          await window.__TAURI__.core.invoke("open_desktop_item", { path });
        } catch (e) {
          console.warn("open failed", e);
        }
      }

      function render(items) {
        grid.innerHTML = "";
        if (!items || !items.length) {
          empty.style.display = "block";
          return;
        }
        empty.style.display = "none";
        for (const item of items) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.title = item.path;
          const iconWrap = document.createElement("div");
          iconWrap.className = "icon" + (item.isDir ? " folder" : "");
          if (item.icon) {
            const img = document.createElement("img");
            img.alt = "";
            img.src = item.icon;
            iconWrap.appendChild(img);
          } else {
            iconWrap.textContent = iconFor(item);
          }
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = item.name;
          cell.appendChild(iconWrap);
          cell.appendChild(name);
          cell.addEventListener("dblclick", () => openItem(item.path));
          grid.appendChild(cell);
        }
      }

      window.__fenceApply = render;

      async function boot() {
        if (!window.__TAURI__) return;
        try {
          const items = await window.__TAURI__.core.invoke("list_desktop_items");
          render(items);
        } catch (e) {
          console.warn("list_desktop_items failed", e);
        }
        try {
          await window.__TAURI__.event.listen("fence-items", (e) => render(e.payload || []));
        } catch (e) {
          console.warn("listen fence-items failed", e);
        }
      }
      boot();
    </script>
  </body>
</html>
