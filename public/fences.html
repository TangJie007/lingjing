<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      * { box-sizing: border-box; }
      html, body, #stage, #apps, #files {
        margin: 0;
        border: none;
        outline: none;
        box-shadow: none;
        background: transparent;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
        user-select: none;
        color: #f4f6fb;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #apps {
        position: absolute;
        left: 2px;
        top: 2px;
        height: calc(100% - 8px);
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 0 2px;
      }
      #files {
        position: absolute;
        right: 24px;
        top: 24px;
        bottom: 24px;
        width: min(420px, 32vw);
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: transparent;
        border: none;
        box-shadow: none;
        outline: none;
      }
      .fence {
        flex: 1 1 0;
        min-height: 180px;
        padding: 12px 12px 14px;
        border-radius: 16px;
        background: rgba(16, 18, 24, 0.42);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        overflow: auto;
      }
      .fence-title {
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.82);
        padding: 2px 8px 10px;
      }
      .fence-grid {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 2px;
      }
      .fence-empty {
        padding: 18px 8px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.38);
      }
      .cell {
        width: 84px;
        padding: 8px 4px 10px;
        border-radius: 10px;
        text-align: center;
        cursor: default;
        border: none;
        background: transparent;
      }
      .cell:hover { background: rgba(255, 255, 255, 0.12); }
      .cell:active { background: rgba(255, 255, 255, 0.18); }
      .cell.native {
        width: 76px;
        padding: 5px 2px 4px;
        border: none;
        outline: none;
        border-radius: 4px;
        background: transparent;
        box-shadow: none;
      }
      .cell.native:hover,
      .cell.native:active,
      .cell.native:focus {
        border: none;
        outline: none;
        box-shadow: none;
        background: rgba(255, 255, 255, 0.14);
      }
      .cell.native .name {
        color: #fff;
        font-weight: 400;
        text-shadow:
          0 0 3px #000,
          1px 1px 1px #000,
          -1px 0 1px rgba(0, 0, 0, 0.7);
      }
      .cell.native .icon img {
        filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, 0.45));
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 6px;
        display: grid;
        place-items: center;
        font-size: 28px;
        line-height: 1;
      }
      .icon.folder { font-size: 34px; }
      .icon img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        display: block;
        image-rendering: auto;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.45));
      }
      .name {
        font-size: 12px;
        line-height: 1.25;
        word-break: break-all;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85), 0 0 10px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="apps"></div>
      <div id="files">
        <section class="fence" data-kind="image">
          <div class="fence-title">图片</div>
          <div class="fence-grid" id="images"></div>
        </section>
        <section class="fence" data-kind="document">
          <div class="fence-title">文档</div>
          <div class="fence-grid" id="documents"></div>
        </section>
      </div>
    </div>
    <script>
      const appsEl = document.getElementById("apps");
      const imagesEl = document.getElementById("images");
      const documentsEl = document.getElementById("documents");

      function iconFor(item) {
        if (item.isDir) return "📁";
        const ext = (item.name.split(".").pop() || "").toLowerCase();
        const map = {
          lnk: "🔗", exe: "⚙️", txt: "📄", pdf: "📕",
          doc: "📘", docx: "📘", xls: "📗", xlsx: "📗",
          ppt: "📙", pptx: "📙", zip: "🗜️", rar: "🗜️",
          png: "🖼️", jpg: "🖼️", jpeg: "🖼️", gif: "🖼️",
          webp: "🖼️", mp4: "🎬", mp3: "🎵",
        };
        return map[ext] || "📄";
      }

      async function openItem(path) {
        if (!window.__TAURI__) return;
        try {
          await window.__TAURI__.core.invoke("open_desktop_item", { path });
        } catch (e) {
          console.warn("open failed", e);
        }
      }

      function makeCell(item, native) {
        const cell = document.createElement("div");
        cell.className = native ? "cell native" : "cell";
        cell.title = item.path;
        const iconWrap = document.createElement("div");
        iconWrap.className = "icon" + (item.isDir ? " folder" : "");
        if (item.icon) {
          const img = document.createElement("img");
          img.alt = "";
          img.src = item.icon;
          iconWrap.appendChild(img);
        } else {
          iconWrap.textContent = iconFor(item);
        }
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = item.name;
        cell.appendChild(iconWrap);
        cell.appendChild(name);
        cell.addEventListener("dblclick", () => openItem(item.path));
        return cell;
      }

      function fillGrid(el, items, emptyText) {
        el.innerHTML = "";
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "fence-empty";
          empty.textContent = emptyText;
          el.appendChild(empty);
          return;
        }
        for (const item of items) el.appendChild(makeCell(item, false));
      }

      function render(items) {
        const list = items || [];
        const apps = list.filter((i) => i.kind === "app");
        const images = list.filter((i) => i.kind === "image");
        const documents = list.filter((i) => i.kind === "document" || i.kind === "other");
        appsEl.innerHTML = "";
        for (const item of apps) appsEl.appendChild(makeCell(item, true));
        fillGrid(imagesEl, images, "暂无图片");
        fillGrid(documentsEl, documents, "暂无文档");
      }

      window.__fenceApply = render;

      async function boot() {
        if (!window.__TAURI__) return;
        try {
          const items = await window.__TAURI__.core.invoke("list_desktop_items");
          render(items);
        } catch (e) {
          console.warn("list_desktop_items failed", e);
        }
        try {
          await window.__TAURI__.event.listen("fence-items", (e) => render(e.payload || []));
        } catch (e) {
          console.warn("listen fence-items failed", e);
        }
      }
      boot();
    </script>
  </body>
</html>
