<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINGJING Wallpaper</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: fixed;
        inset: 0;
        background: #000;
      }
      .pane {
        position: absolute;
        overflow: hidden;
        background: #000;
      }
      .pane video,
      .pane img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
        background: #000;
      }
      .pane video.on,
      .pane img.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const stage = document.getElementById("stage");
      let reportTimer = null;
      let lastState = null;
      let layoutKey = "";
      let panes = [];

      function isVideo(type, uri) {
        const t = (type || "").toLowerCase();
        if (t === "video") return true;
        return /\.(mp4|webm)(\?|$)/i.test(uri || "");
      }

      function isBenignPlayError(err) {
        const name = err && err.name ? String(err.name) : "";
        const msg = err && err.message ? String(err.message) : String(err || "");
        const hay = (name + " " + msg).toLowerCase();
        return hay.includes("aborterror") || hay.includes("interrupted by a new load");
      }

      function safePlay(vid, onError) {
        const p = vid.play();
        if (!p || !p.then) return;
        p.then(() => {
          if (onError) onError(null);
        }).catch((e) => {
          if (isBenignPlayError(e)) return;
          if (onError) onError(e);
        });
      }

      function loadVideo(vid, uri) {
        return new Promise((resolve, reject) => {
          let settled = false;
          const finish = (fn, value) => {
            if (settled) return;
            settled = true;
            vid.removeEventListener("canplay", onCanPlay);
            vid.removeEventListener("error", onError);
            fn(value);
          };
          const onCanPlay = () => {
            safePlay(vid, (err) => {
              if (err) finish(reject, err);
              else finish(resolve);
            });
          };
          const onError = () => finish(reject, new Error("视频解码失败"));
          vid.addEventListener("canplay", onCanPlay, { once: true });
          vid.addEventListener("error", onError, { once: true });
          if (vid.src !== uri) {
            vid.src = uri;
            vid.load();
          } else {
            onCanPlay();
          }
        });
      }

      function clearReport() {
        if (reportTimer) {
          clearInterval(reportTimer);
          reportTimer = null;
        }
      }

      async function report(partial) {
        try {
          if (window.__TAURI__?.core?.invoke) {
            await window.__TAURI__.core.invoke("engine_report_progress", {
              payload: partial,
            });
          }
        } catch (_) {}
      }

      function primaryVideo() {
        const pane = panes.find((p) => p.primary) || panes[0];
        return pane ? pane.vid : null;
      }

      function startVideoReport() {
        clearReport();
        reportTimer = setInterval(() => {
          const vid = primaryVideo();
          if (!vid) return;
          report({
            currentTime: vid.currentTime || 0,
            duration: Number.isFinite(vid.duration) ? vid.duration : 0,
            playing: !vid.paused,
          });
        }, 1000);
      }

      function defaultLayout() {
        return [
          {
            x: 0,
            y: 0,
            w: Math.max(1, window.innerWidth || 0),
            h: Math.max(1, window.innerHeight || 0),
            primary: true,
          },
        ];
      }

      function applyLayout(layout) {
        const tiles =
          Array.isArray(layout) && layout.length ? layout : defaultLayout();
        const key = JSON.stringify(tiles);
        if (key === layoutKey && panes.length) return;
        layoutKey = key;
        for (const pane of panes) {
          try {
            pane.vid.pause();
          } catch (_) {}
        }
        stage.innerHTML = "";
        panes = tiles.map((tile) => {
          const el = document.createElement("div");
          el.className = "pane";
          el.style.left = (tile.x || 0) + "px";
          el.style.top = (tile.y || 0) + "px";
          el.style.width = (tile.w || 0) + "px";
          el.style.height = (tile.h || 0) + "px";
          const vid = document.createElement("video");
          vid.playsInline = true;
          vid.loop = true;
          vid.muted = true;
          vid.autoplay = true;
          const img = document.createElement("img");
          img.alt = "";
          el.appendChild(vid);
          el.appendChild(img);
          stage.appendChild(el);
          vid.addEventListener("error", () => {
            if (tile.primary) {
              report({ currentTime: 0, duration: 0, error: "视频解码失败", playing: false });
            }
          });
          return { el, vid, img, primary: !!tile.primary };
        });
        if (!panes.some((p) => p.primary) && panes[0]) panes[0].primary = true;
      }

      function applyMedia(state, cmd) {
        const uri = state.uri || "";
        const mediaType = state.mediaType || "";
        const volume = typeof state.volume === "number" ? state.volume : 0.8;
        const muted = !!state.muted;
        const lowPower = !!state.lowPower;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const staticPreferred = lowPower || reduceMotion;
        if (!panes.length) applyLayout(null);

        if (cmd === "set" || cmd === undefined || cmd === null) {
          if (isVideo(mediaType, uri) && !(staticPreferred && mediaType.toLowerCase() === "gif")) {
            panes.forEach((pane, i) => {
              pane.img.classList.remove("on");
              pane.img.removeAttribute("src");
              pane.vid.classList.add("on");
              pane.vid.loop = true;
              pane.vid.muted = true;
              pane.vid.volume = pane.primary ? volume : 0;
              pane.vid.playbackRate = lowPower ? 0.75 : 1;
              loadVideo(pane.vid, uri)
                .then(() => {
                  if (pane.primary) {
                    pane.vid.muted = muted;
                    pane.vid.volume = volume;
                  } else {
                    pane.vid.muted = true;
                    pane.vid.volume = 0;
                  }
                  if (staticPreferred) {
                    pane.vid.pause();
                  }
                })
                .catch((e) => {
                  if (pane.primary && !isBenignPlayError(e)) {
                    report({ currentTime: 0, duration: 0, error: String(e.message || e), playing: false });
                  }
                });
            });
            startVideoReport();
          } else {
            clearReport();
            panes.forEach((pane) => {
              pane.vid.pause();
              pane.vid.removeAttribute("src");
              pane.vid.classList.remove("on");
              pane.img.classList.add("on");
              pane.img.src = uri;
              pane.img.onerror = () => {
                if (pane.primary) {
                  report({ currentTime: 0, duration: 0, error: "图片加载失败", playing: false });
                }
              };
            });
            report({ currentTime: 0, duration: 0, playing: true });
          }
          return;
        }

        if (cmd === "play") {
          if (panes.some((pane) => pane.vid.classList.contains("on"))) {
            panes.forEach((pane) => {
              if (pane.vid.classList.contains("on")) safePlay(pane.vid);
            });
            startVideoReport();
          } else if (lastState) {
            applyMedia(lastState, "set");
          } else {
            report({ currentTime: 0, duration: 0, playing: true });
          }
          return;
        }

        if (cmd === "pause") {
          const vid = primaryVideo();
          panes.forEach((pane) => pane.vid.pause());
          if (vid && vid.classList.contains("on")) {
            report({
              currentTime: vid.currentTime || 0,
              duration: Number.isFinite(vid.duration) ? vid.duration : 0,
              playing: false,
            });
          } else {
            report({ currentTime: 0, duration: 0, playing: false });
          }
          return;
        }

        if (cmd === "clear") {
          clearReport();
          panes.forEach((pane) => {
            pane.vid.pause();
            pane.vid.removeAttribute("src");
            pane.vid.classList.remove("on");
            pane.img.removeAttribute("src");
            pane.img.classList.remove("on");
          });
          report({ currentTime: 0, duration: 0, playing: false });
          return;
        }

        if (cmd === "volume") {
          panes.forEach((pane) => {
            if (!pane.vid.classList.contains("on")) return;
            if (pane.primary) {
              pane.vid.volume = volume;
              pane.vid.muted = muted;
            } else {
              pane.vid.volume = 0;
              pane.vid.muted = true;
            }
          });
        }
      }

      function resumeIfNeeded() {
        if (!lastState || lastState.playing === false || lastState.userPaused) return;
        const needsResume = panes.some(
          (pane) => pane.vid.classList.contains("on") && pane.vid.paused && !pane.vid.ended,
        );
        if (!needsResume) return;
        // Soft resume — do not re-run full "set" (reload src); that freezes after long runs.
        panes.forEach((pane) => {
          if (pane.vid.classList.contains("on") && pane.vid.paused) {
            safePlay(pane.vid);
          }
        });
      }

      window.__wallpaperApply = function (state, cmd, layout) {
        lastState = state || lastState;
        applyLayout(layout);
        if (!lastState) return;
        const doApply = () => applyMedia(lastState, cmd);
        if (document.readyState === "complete" || document.readyState === "interactive") {
          doApply();
        } else {
          document.addEventListener("DOMContentLoaded", doApply, { once: true });
        }
      };

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") resumeIfNeeded();
      });
      window.addEventListener("focus", resumeIfNeeded);
      // After long sleep, primary decoder often stays paused while secondary keeps going.
      setInterval(resumeIfNeeded, 4000);

      (async () => {
        try {
          const listen = window.__TAURI__?.event?.listen;
          if (listen) {
            await listen("wallpaper-cmd", (ev) => {
              const payload = ev.payload || {};
              window.__wallpaperApply(payload.state, payload.cmd, payload.layout);
            });
          }
        } catch (_) {}
      })();
    </script>
  </body>
</html>
