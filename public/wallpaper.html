<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINGJING Wallpaper</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
      video,
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      video.on,
      img.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="vid" playsinline loop muted></video>
      <img id="img" alt="" />
    </div>
    <script>
      const vid = document.getElementById("vid");
      const img = document.getElementById("img");
      let reportTimer = null;
      let lastState = null;

      function isVideo(type, uri) {
        const t = (type || "").toLowerCase();
        if (t === "video") return true;
        return /\.(mp4|webm)(\?|$)/i.test(uri || "");
      }

      function clearReport() {
        if (reportTimer) {
          clearInterval(reportTimer);
          reportTimer = null;
        }
      }

      async function report(partial) {
        try {
          if (window.__TAURI__?.core?.invoke) {
            await window.__TAURI__.core.invoke("engine_report_progress", {
              payload: partial,
            });
          }
        } catch (_) {}
      }

      function startVideoReport() {
        clearReport();
        reportTimer = setInterval(() => {
          report({
            currentTime: vid.currentTime || 0,
            duration: Number.isFinite(vid.duration) ? vid.duration : 0,
            playing: !vid.paused,
          });
        }, 250);
      }

      window.__wallpaperApply = function (state, cmd) {
        lastState = state || lastState;
        if (!lastState) return;
        const uri = lastState.uri || "";
        const mediaType = lastState.mediaType || "";
        const playing = !!lastState.playing;
        const volume = typeof lastState.volume === "number" ? lastState.volume : 0.8;
        const muted = !!lastState.muted;

        if (cmd === "set" || cmd === undefined || cmd === null) {
          if (isVideo(mediaType, uri)) {
            img.classList.remove("on");
            img.removeAttribute("src");
            vid.classList.add("on");
            // Single-loop mode keeps native loop; list/random rely on ended → main advances.
            vid.loop = false;
            vid.src = uri;
            vid.volume = volume;
            vid.muted = muted;
            const p = vid.play();
            if (p && p.catch) p.catch((e) => report({ currentTime: 0, duration: 0, error: String(e), playing: false }));
            startVideoReport();
          } else {
            clearReport();
            vid.pause();
            vid.removeAttribute("src");
            vid.classList.remove("on");
            img.classList.add("on");
            img.src = uri;
            report({ currentTime: 0, duration: 0, playing: true });
            img.onerror = () => report({ currentTime: 0, duration: 0, error: "图片加载失败", playing: false });
          }
          return;
        }

        if (cmd === "play") {
          if (vid.classList.contains("on")) {
            const p = vid.play();
            if (p && p.catch) p.catch(() => {});
            startVideoReport();
          } else {
            report({ currentTime: 0, duration: 0, playing: true });
          }
          return;
        }

        if (cmd === "pause") {
          if (vid.classList.contains("on")) {
            vid.pause();
            report({
              currentTime: vid.currentTime || 0,
              duration: Number.isFinite(vid.duration) ? vid.duration : 0,
              playing: false,
            });
          } else {
            report({ currentTime: 0, duration: 0, playing: false });
          }
          return;
        }

        if (cmd === "volume") {
          if (vid.classList.contains("on")) {
            vid.volume = volume;
            vid.muted = muted;
          }
        }
      };

      // Listen Tauri events when available
      (async () => {
        try {
          const listen = window.__TAURI__?.event?.listen;
          if (listen) {
            await listen("wallpaper-cmd", (ev) => {
              const payload = ev.payload || {};
              window.__wallpaperApply(payload.state, payload.cmd);
            });
          }
        } catch (_) {}
      })();

      vid.addEventListener("error", () => {
        report({ currentTime: 0, duration: 0, error: "视频解码失败", playing: false });
      });
      vid.addEventListener("ended", () => {
        report({
          currentTime: Number.isFinite(vid.duration) ? vid.duration : 0,
          duration: Number.isFinite(vid.duration) ? vid.duration : 0,
          playing: false,
        });
      });
    </script>
  </body>
</html>
