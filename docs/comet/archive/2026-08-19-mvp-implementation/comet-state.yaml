acceptance:
  - id: A1
    source: specs/discover-browse/spec.md
    text: The app MUST render a categorized wallpaper grid from a local placeholder
      catalog (bundled JSON of demo entries with thumbnails), so browsing is
      demonstrable offline. Each card shows thumbnail, title, size, and type tag
      (video / GIF / image). A category tag cloud (全部·推荐·游戏·动漫·风景·动物·
      科技·趣味·人机交互) and sort (最热/最新) are selectable. Top-bar search box with
      hot-word hints and results/empty states.
    result: passed
    reason:
      text: Placeholder catalog with 24 demo entries (src/data/catalog.ts:39-52,
        GRADIENTS at 28-37) feeds a 9-category tag cloud
        (src/data/catalog.ts:14-24) plus 2 sort options
        (src/data/catalog.ts:26). Top-bar search bound to shared ref
        (src/App.vue:18-19, src/components/TopBar.vue:10,39) drives the grid
        filter (src/components/WallpaperGrid.vue:9,27-30). All wired in
        App.vue:99-104.
      truncated: false
  - id: A2
    source: specs/discover-browse/spec.md
    text: WHEN the app loads the catalog THEN a grid of placeholder wallpaper cards
      renders with thumbnail, title, size, and type tag. (A1-grid)
    result: passed
    reason:
      text: "WallpaperGrid renders each item as a card showing thumbnail
        (WallpaperGrid.vue:103, gradient background), title (line 105), type tag
        (line 106) and size pill (line 109). Confirmed in built JS bundle: class
        list and structure match the template (dist/assets/index-*.js)."
      truncated: false
  - id: A3
    source: specs/discover-browse/spec.md
    text: WHEN the user selects a category tag or sort THEN the grid filters
      accordingly and the selection persists within the session. (A1-filter)
    result: passed
    reason:
      text: activeCat ref filters by category (WallpaperGrid.vue:5,26) and persists
        within the session (component-local reactive state; matches the literal
        'within the session' wording; no full-page reload). Sort (line 6)
        selectable. Both rendered in the tag/sort row (lines 49-74).
      truncated: false
  - id: A4
    source: specs/discover-browse/spec.md
    text: WHEN the user types in search THEN results/empty states display.
      (A1-search)
    result: passed
    reason:
      text: TopBar search input (TopBar.vue:38-43) is v-modeled to a shared ref
        injected from App (App.vue:18-19). WallpaperGrid filters by name match
        (WallpaperGrid.vue:27-30) and renders an empty state ('没有匹配的壁纸') when no
        matches (line 132-134).
      truncated: false
  - id: A5
    source: specs/discover-browse/spec.md
    text: Hovering a card MUST reveal a quick-action bar (▶ 预览 / 设为壁纸). Clicking a
      card MUST slide in the 320px frosted right drawer (no route jump) with a
      large preview, a 60-second SVG countdown ring (auto-collapses at zero,
      cancellable), and an action area (favorite / share / download / set).
      Right-click context menu (set / favorite / share / details).
    result: passed
    reason:
      text: "Hover quick-action bar (WallpaperGrid.vue:114-129) reveals ▶ 预览 / 设为壁纸
        via group-hover:translate-y-0. Click opens 320px frosted drawer
        (DetailDrawer.vue:64, w-80 + bg-[var(--bg-elevated)]/80
        backdrop-blur-xl). 60s SVG ring (DetailDrawer.vue:85-91) auto-collapses
        at zero (lines 19-26) and is cancellable via the '取消' button (lines
        96-103, cancelAutoClose at 30-33). Actions: 设为壁纸/收藏/⤓/↗ (lines 106-129).
        Right-click context menu via @contextmenu (WallpaperGrid.vue:101) and
        App.vue:117-131."
      truncated: false
  - id: A6
    source: specs/discover-browse/spec.md
    text: WHEN the user hovers a card THEN a quick-action bar (预览 / 设为壁纸) appears.
      (A3-hover)
    result: passed
    reason:
      text: Card group-hover triggers translate-y-0 on .quick-actions
        (WallpaperGrid.vue:115), revealing 预览/设为壁纸. Compiled CSS contains
        .group-hover\:translate-y-0:is(:where(.group):hover
        *){--tw-translate-y:0px;translate:var(--tw-translate-x)
        var(--tw-translate-y)} (dist/assets/index-*.css utilities layer).
      truncated: false
  - id: A7
    source: specs/discover-browse/spec.md
    text: WHEN the user clicks a card THEN the 320px frosted drawer slides in with a
      large preview and a 60s countdown ring that auto-collapses at zero but is
      cancellable. (A3-drawer)
    result: passed
    reason:
      text: Drawer opens with transition (DetailDrawer.vue:61,135-143) using
        transform/opacity only. Countdown starts on open (lines 41-47),
        decrements every 1s, and on hitting zero calls emit('close') (line 23).
        cancelAutoClose (lines 30-33) stops the timer without emitting close, so
        drawer remains open. Bound to '取消' button (line 100).
      truncated: false
  - id: A8
    source: specs/discover-browse/spec.md
    text: WHEN the user right-clicks a card THEN a context menu (set / favorite /
      share / details) appears and is keyboard reachable. (A3-menu)
    result: passed
    reason:
      text: Context menu is a role=menu container (App.vue:120) with role=menuitem
        buttons (lines 127-130). Auto-focuses first item on open (lines 40-45).
        onMenuKey handler supports ArrowUp/ArrowDown with wraparound (lines
        49-62) and Escape (lines 51-55), so ↑↓ navigate, Enter activates (native
        button click), Esc dismisses.
      truncated: false
