      truncated: false
  - id: A19
    source: specs/shell-layout/spec.md
    text: "The app MUST animate using only `transform` / `opacity` (no reflow).
      Motion tokens: `--dur-fast 150ms`, `--dur-base 280ms`, `--dur-slow 520ms`,
      `--ease cubic-bezier(.4,0,.2,1)`, `--ease-spring
      cubic-bezier(.34,1.7,.5,1)`. Card entrance uses staggered upward float
      with skeleton placeholders."
    result: passed
    reason:
      text: "A19 fully repaired. (1) src/styles/global.css:23 registers
        '--animate-card-in:card-in var(--dur-slow) var(--ease) both' inside
        @theme. (2) src/styles/global.css:87-90 defines @keyframes card-in {
        0%{opacity:0;transform:translateY(12px)}
        to{opacity:1;transform:translateY(0)} } — transform/opacity only. (3)
        src/components/WallpaperGrid.vue:98 applies the animate-card-in class to
        real cards with :style=\"{ animationDelay: idx*28+'ms' }\" (line 99) for
        the stagger. (4) src/components/WallpaperGrid.vue:80-92 adds a 12-card
        skeleton placeholder grid (v-for i in 12 with .skeleton-card and a 16:10
        placeholder div + 2 text rows) gated by v-if='!ready', where ready flips
        true on nextTick after onMounted (lines 15-16) so the skeletons appear
        briefly before the real grid. (5) Build is clean:
        dist/assets/index-f_REr5z7.css contains the @theme registration
        '--animate-card-in:card-in var(--dur-slow) var(--ease) both' inside
        @layer theme, the utility
        '.animate-card-in{animation:var(--animate-card-in)}' in the @layer
        utilities, and the standalone '@keyframes
        card-in{0%{opacity:0;transform:translateY(12px)}to{opacity:1;transform:\
        translateY(0)}}' rule. The dist JS bundle (index-CMkx0mG9.js) also
        confirms the skeleton divs ('skeleton-card overflow-hidden rounded-xl
        …') render before the real cards. All three bars (token in @theme,
        keyframe, and class on cards + skeleton placeholder grid) are satisfied
        in the actual built artifacts."
      truncated: false
  - id: A20
    source: specs/shell-layout/spec.md
    text: WHEN cards mount or the drawer opens THEN transitions use only transform/
      opacity and durations from the 150/280/520ms token set. (A7)
    result: passed
    reason:
      text: Card mount uses --animate-card-in which only animates transform/opacity
        (global.css:87-90). Drawer transition (DetailDrawer.vue:135-143) uses
        'transform var(--dur-base) var(--ease), opacity var(--dur-base)
