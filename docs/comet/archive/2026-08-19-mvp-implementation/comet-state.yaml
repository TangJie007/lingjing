        transform/opacity only with the 280ms token. Real cards have
        transition-transform duration-[var(--dur-base)] on hover
        (WallpaperGrid.vue:98).
      truncated: false
  - id: A21
    source: specs/shell-layout/spec.md
    text: WHEN `prefers-reduced-motion` is set THEN entrance/transition animations
