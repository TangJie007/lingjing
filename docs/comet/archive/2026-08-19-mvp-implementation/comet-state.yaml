  - id: A16
    source: specs/shell-layout/spec.md
    text: "The app MUST apply the Frost Light (浅色) token baseline: `--bg #F4F5F7`,
      `--surface #FFFFFF`, `--primary #4F46E5`, `--secondary #0891B2`, `--text
