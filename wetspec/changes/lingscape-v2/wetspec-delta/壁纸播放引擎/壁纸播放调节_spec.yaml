metadata:
  id: WP-004
  name: 壁纸播放调节
  module: 壁纸播放引擎
  version: "2.0.0"
  status: draft
  priority: P2
  source: R-14
  created: "2026-06-15"
  prd_version: V2.0

description: >
  支持对视频壁纸进行播放速度、亮度、饱和度、对比度的实时调节。
  通过 GPU Shader / DirectX 滤镜实现，不修改源文件。

user_stories:
  - id: US-001
    story: 作为用户，我希望调节壁纸的播放速度和画面效果，以便获得满意的视觉效果
    acceptance_criteria:
      - id: AC-001
        description: 支持播放速度调节：0.5x / 1x / 1.5x / 2x，默认 1x
        test_method: auto
      - id: AC-002
        description: 支持亮度调节：-50% ~ +50%，默认 0
        test_method: auto
      - id: AC-003
        description: 支持饱和度调节：-50% ~ +50%，默认 0
        test_method: auto
      - id: AC-004
        description: 支持对比度调节：-50% ~ +50%，默认 0
        test_method: auto
      - id: AC-005
        description: 调节实时预览，不修改源文件
        test_method: auto

