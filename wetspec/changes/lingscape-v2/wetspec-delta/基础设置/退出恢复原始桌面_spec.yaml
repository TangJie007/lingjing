metadata:
  id: SET-006
  name: 退出恢复原始桌面
  module: 基础设置
  version: "2.0.0"
  status: draft
  priority: P0
  source: R-05
  created: "2026-06-15"
  prd_version: V2.0

description: >
  当用户关闭/退出灵境时，自动将 Windows 桌面壁纸恢复为进入灵境之前的原始壁纸，
  不留下任何残留。支持正常退出恢复、崩溃恢复检测、设置开关。

user_stories:
  - id: US-001
    story: 作为用户，我希望退出灵境后桌面恢复为原来的壁纸，以便不留残留
    acceptance_criteria:
      - id: AC-001
        description: 启动时读取并备份当前 Windows 壁纸路径和显示方式到 %AppData%\LingScape\backup\
        test_method: auto
      - id: AC-002
        description: 正常退出（托盘退出/关闭按钮）时恢复原始壁纸并清除快照
        test_method: auto
      - id: AC-003
        description: 关闭窗口（最小化到托盘）时不恢复壁纸
        test_method: auto
      - id: AC-004
        description: 系统关机/重启时尝试恢复原始壁纸
        test_method: auto
  - id: US-002
    story: 作为用户，我希望灵境崩溃后重新打开时能检测到未恢复的壁纸
    acceptance_criteria:
      - id: AC-005
        description: 启动时检测是否有未恢复的快照，若有则弹出提示询问是否恢复
        test_method: auto
  - id: US-003
    story: 作为用户，我希望可以控制退出时是否恢复原始桌面
    acceptance_criteria:
      - id: AC-006
        description: 设置中提供「退出时恢复原始桌面」开关，默认开启
        test_method: auto
      - id: AC-007
        description: 设置中提供「退出前询问确认」开关，默认关闭
        test_method: auto

acceptance_criteria:
  - id: AC-001
