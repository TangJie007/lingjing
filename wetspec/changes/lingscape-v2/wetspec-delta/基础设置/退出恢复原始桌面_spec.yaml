    test_method: auto
  - id: AC-003
    description: 关闭窗口（最小化到托盘）时不恢复壁纸
    test_method: auto
  - id: AC-004
    description: 系统关机/重启时尝试恢复原始壁纸
    test_method: auto
  - id: AC-005
    description: 启动时检测是否有未恢复的快照，若有则弹出提示询问是否恢复
    test_method: auto
  - id: AC-006
    description: 设置中提供「退出时恢复原始桌面」开关，默认开启
