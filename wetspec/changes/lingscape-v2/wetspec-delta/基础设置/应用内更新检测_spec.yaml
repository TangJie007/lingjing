metadata:
  id: SET-009
  name: 应用内更新检测
  module: 基础设置
  version: "2.0.0"
  status: draft
  priority: P0
  source: R-16
  created: "2026-06-15"
  prd_version: V2.0

description: >
  应用启动时检测是否有新版本，有则通知用户。
  Steam 版依赖 Steam 自动更新仅展示版本号；官网直售版请求版本接口弹横幅提示。

user_stories:
  - id: US-001
    story: 作为用户，我希望应用能自动检测新版本，以便及时更新
    acceptance_criteria:
      - id: AC-001
        description: 启动时检测版本号，Steam 版仅展示当前版本
        test_method: auto
      - id: AC-002
        description: 官网直售版请求 GitHub Release 或自建 JSON 接口，有新版时顶部横幅提示
        test_method: auto
      - id: AC-003
        description: 横幅可一键关闭，不阻塞正常使用
        test_method: auto

acceptance_criteria:
  - id: AC-001
    description: 启动时检测版本号，Steam 版仅展示当前版本
    test_method: auto
  - id: AC-002
    description: 官网直售版请求 GitHub Release 或自建 JSON 接口，有新版时顶部横幅提示
    test_method: auto
  - id: AC-003
    description: 横幅可一键关闭，不阻塞正常使用
    test_method: auto

