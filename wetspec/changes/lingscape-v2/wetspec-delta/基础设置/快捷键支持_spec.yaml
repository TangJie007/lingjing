metadata:
  id: SET-010
  name: 快捷键支持
  module: 基础设置
  version: "2.0.0"
  status: draft
  priority: P2
  source: R-15
  created: "2026-06-15"
  prd_version: V2.0

description: >
  提供全局快捷键支持，包括快速切换壁纸、暂停播放、隐藏图标等。
  支持用户自定义快捷键，避免与其他应用冲突。

user_stories:
  - id: US-001
    story: 作为进阶用户，我希望用快捷键快速操作壁纸，以便提高效率
    acceptance_criteria:
      - id: AC-001
        description: Ctrl+Shift+W 随机切换下一张壁纸
        test_method: auto
      - id: AC-002
        description: Ctrl+Shift+P 暂停/继续动态壁纸播放
        test_method: auto
      - id: AC-003
        description: Ctrl+Shift+H 隐藏/显示桌面图标
        test_method: auto
      - id: AC-004
        description: 详情页快捷键：空格=播放/暂停，左右箭头=导航，Esc=返回，Ctrl+F=搜索
        test_method: auto
      - id: AC-005
        description: 设置页支持用户自定义修改全局快捷键
        test_method: auto

