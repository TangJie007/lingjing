metadata:
  id: DO-002
  name: 文件夹门户
  module: 桌面整理
  version: "2.0.0"
  status: draft
  priority: P1
  source: R-06
  created: "2026-06-15"
  prd_version: V2.0

description: >
  将真实文件夹映射到桌面分区，直接在桌面操作文件夹内容，无需打开资源管理器。
  分区内实时同步文件夹内容，支持拖入文件到分区（实际移动到映射文件夹）。

user_stories:
  - id: US-001
    story: 作为用户，我希望将文件夹映射到桌面分区，以便直接在桌面操作文件
    acceptance_criteria:
      - id: AC-001
        description: 新建分区时可选择文件夹门户模式，选择本地文件夹
        test_method: auto
      - id: AC-002
        description: 分区内实时显示映射文件夹的所有文件和子文件夹
        test_method: auto
      - id: AC-003
        description: 双击分区内文件用系统默认程序打开
        test_method: auto
      - id: AC-004
        description: 拖入新文件到分区，实际移动到映射的文件夹
        test_method: auto
      - id: AC-005
        description: 文件夹内容外部变化时分区内实时刷新
        test_method: auto
      - id: AC-006
        description: 映射文件夹被删除时分区内显示提示
        test_method: auto

