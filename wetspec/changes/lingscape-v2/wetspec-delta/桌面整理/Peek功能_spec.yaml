metadata:
  id: DO-003
  name: Peek功能
  module: 桌面整理
  version: "2.0.0"
  status: draft
  priority: P1
  source: R-06
  created: "2026-06-15"
  prd_version: V2.0

description: >
  用户在全屏应用（游戏、PPT、全屏视频）时，按热键临时呼出所有分区，
  快速找到/打开文件，然后自动消失。默认热键 Win+Shift+P，可自定义。

user_stories:
  - id: US-001
    story: 作为用户，我希望在全屏应用时快速访问桌面分区，以便找到文件
    acceptance_criteria:
      - id: AC-001
        description: 按 Win+Shift+P 临时显示所有分区在最前端（覆盖全屏应用）
        test_method: auto
      - id: AC-002
        description: 无操作 3 秒后自动隐藏，有操作时持续显示
        test_method: auto
      - id: AC-003
        description: 按 Esc 立即隐藏分区
        test_method: auto
      - id: AC-004
        description: 点击分区内文件打开后分区自动隐藏
        test_method: auto
      - id: AC-005
        description: 设置中可自定义 Peek 热键和显示时长
        test_method: auto

