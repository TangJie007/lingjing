  name: AI生成历史重新生成
  module: AI生成管线
  version: "2.0.0"
  status: draft
  priority: P1
  source: R-10
  created: "2026-06-15"
  prd_version: V2.0

description: >
  在壁纸详情页中，AI 生成的壁纸可以「用此方案重新生成」。
  点击后打开 AI 创作页面，预填原始描述、优化 Prompt、风格标签、模型，
  用户可微调后再次生成新一批变体。

user_stories:
  - id: US-001
    story: 作为用户，我希望基于满意的历史 prompt 微调重新生成，以便获得更好的变体
    acceptance_criteria:
      - id: AC-001
        description: AI 生成壁纸详情页有「用此方案重新生成」按钮
        test_method: auto
      - id: AC-002
        description: 点击后打开 AI 创作页面，预填原始描述、优化 Prompt、风格标签、模型
        test_method: auto
      - id: AC-003
        description: 用户可修改任意预填字段后点击生成
        test_method: auto

