[[permission]]
identifier = "allow-list-wallpapers"
description = "Enables the list_wallpapers command."
commands.allow = ["list_wallpapers"]

[[permission]]
identifier = "allow-import-wallpaper"
description = "Enables the import_wallpaper command."
commands.allow = ["import_wallpaper"]

[[permission]]
identifier = "allow-delete-wallpaper"
description = "Enables the delete_wallpaper command."
commands.allow = ["delete_wallpaper"]

[[permission]]
identifier = "allow-export-wallpaper"
description = "Enables the export_wallpaper command."
commands.allow = ["export_wallpaper"]

[[permission]]
identifier = "allow-set-wallpaper"
description = "Enables the set_wallpaper command."
commands.allow = ["set_wallpaper"]

[[permission]]
identifier = "allow-get-current-wallpaper"
description = "Enables the get_current_wallpaper command."
commands.allow = ["get_current_wallpaper"]

[[permission]]
identifier = "allow-get-library-size"
description = "Enables the get_library_size command."
commands.allow = ["get_library_size"]

[[permission]]
identifier = "allow-clear-library"
description = "Enables the clear_library command."
commands.allow = ["clear_library"]

[[permission]]
identifier = "allow-is-fullscreen-app-running"
description = "Enables the is_fullscreen_app_running command."
commands.allow = ["is_fullscreen_app_running"]

[[permission]]
identifier = "allow-attach-desktop-player"
description = "Enables the attach_desktop_player command."
commands.allow = ["attach_desktop_player"]

[[set]]
identifier = "wallpaper-commands"
description = "All wallpaper engine commands."
permissions = [
  "allow-list-wallpapers",
  "allow-import-wallpaper",
  "allow-delete-wallpaper",
  "allow-export-wallpaper",
  "allow-set-wallpaper",
  "allow-get-current-wallpaper",
  "allow-get-library-size",
  "allow-clear-library",
  "allow-is-fullscreen-app-running",
  "allow-attach-desktop-player",
]
