[[permission]]
identifier = "allow-organize-desktop-one-click"
description = "Enables the organize_desktop_one_click command."
commands.allow = ["organize_desktop_one_click"]

[[permission]]
identifier = "allow-enumerate-desktop-icons"
description = "Enables the enumerate_desktop_icons command."
commands.allow = ["enumerate_desktop_icons"]

[[permission]]
identifier = "allow-hide-desktop-icons"
description = "Enables the hide_desktop_icons command."
commands.allow = ["hide_desktop_icons"]

[[permission]]
identifier = "allow-show-desktop-icons"
description = "Enables the show_desktop_icons command."
commands.allow = ["show_desktop_icons"]

[[set]]
identifier = "desktop-organizer-commands"
description = "Desktop organizer commands."
permissions = [
  "allow-organize-desktop-one-click",
  "allow-enumerate-desktop-icons",
  "allow-hide-desktop-icons",
  "allow-show-desktop-icons",
]
