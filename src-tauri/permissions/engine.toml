[[permission]]
identifier = "allow-engine"
description = "Wallpaper engine, library, favorites, settings, and system commands"
commands.allow = [
  "greet",
  "start_drag",
  "minimize_main",
  "hide_main",
  "set_wallpaper",
  "engine_play",
  "engine_pause",
  "engine_set_volume",
  "engine_get_state",
  "engine_report_progress",
  "list_library",
  "import_media",
  "remove_library_item",
  "load_favorites",
  "set_favorite",
  "get_app_paths",
  "load_settings",
  "save_settings",
  "has_version_record",
  "complete_first_run",
  "set_library_dir",
  "migrate_library",
  "get_last_wallpaper",
  "export_wallpaper",
  "open_desktop_item",
  "is_desktop_drag_over_foreign",
  "start_desktop_file_drag",
  "set_desktop_organize",
  "list_desktop_items",
  "refresh_desktop_organize"
]
