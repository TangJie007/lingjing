[[permission]]
identifier = "allow-engine"
description = "Wallpaper engine, library, favorites, settings, and system commands"
commands.allow = [
  "greet",
  "start_drag",
  "minimize_main",
  "hide_main",
  "show_main_settings",
  "set_wallpaper",
  "engine_play",
  "engine_pause",
  "engine_set_volume",
  "engine_get_state",
  "engine_report_progress",
  "list_library",
  "import_media",
  "remove_library_item",
  "load_favorites",
  "set_favorite",
  "get_app_paths",
  "load_settings",
  "save_settings",
  "has_version_record",
  "complete_first_run",
  "set_library_dir",
  "migrate_library",
  "get_last_wallpaper",
  "export_wallpaper",
  "cache_online_wallpaper",
  "open_desktop_item",
  "list_desktop_shell_context_menu",
  "list_desktop_shell_context_submenu",
  "invoke_desktop_shell_context_command",
  "show_desktop_item_in_folder",
  "open_desktop_item_with",
  "open_desktop_item_properties",
  "rename_desktop_item",
  "move_desktop_item_into_folder",
  "delete_desktop_item",
  "is_desktop_drag_over_foreign",
  "start_desktop_file_drag",
  "try_start_desktop_file_drag_if_foreign",
  "arm_desktop_outgoing_drag_watch",
  "cancel_desktop_outgoing_drag_watch",
  "drop_files_to_desktop",
  "show_desktop_native_context_menu",
  "set_desktop_organize",
  "list_desktop_items",
  "load_fence_layout",
  "save_fence_layout",
  "refresh_desktop_organize"
